<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>直播间对话</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header class="top"><div class="crumb">AstrBot / <strong>插件控制台</strong></div><div class="header-actions"><button id="open-selfcheck" class="action" type="button">环境自检</button><button id="reload" class="action" type="button">刷新</button></div></header>
    <div class="header-title">
      <img class="brand-logo" src="./logo.png" alt="" width="64" height="64">
      <h1>直播间对话</h1>
    </div>
    <p class="intro">添加直播间，逐个开启监听。重载插件后会恢复已开启的房间。</p>
    <p id="connection" class="alert" role="status">正在读取插件状态…</p>
    <section id="selfcheck" class="panel pad selfcheck" aria-labelledby="selfcheck-title" hidden>
      <div class="panel-title"><h2 id="selfcheck-title">远端环境自检</h2><span class="caption" id="selfcheck-phase">尚未检查</span></div>
      <p class="caption">使用已保存的配置，检查 FFmpeg 并向所选模型发送内置测试音频和图片，可能产生少量模型用量。</p>
      <div class="selfcheck-controls">
        <label class="field"><span>检查配置</span><select id="selfcheck-room"><option value="">共享默认配置</option></select></label>
        <button id="start-selfcheck" class="action primary" type="button" disabled>开始自检</button>
      </div>
      <p id="selfcheck-error" class="alert" role="status" hidden></p>
      <div id="selfcheck-results" class="selfcheck-results" aria-live="polite"></div>
    </section>
    <div class="workbench">
      <div class="stack">
        <section class="panel pad" id="overview" aria-labelledby="overview-title">
          <div class="panel-title"><h2 id="overview-title">直播间</h2><span class="caption" id="room-summary">读取中</span></div>
          <form class="add-room" id="add-room">
            <label class="field"><span>直播间房间号</span><input id="new-room" type="text" inputmode="numeric" maxlength="20" pattern="[0-9]+" placeholder="例如 246810" required disabled></label>
            <button class="action primary" id="add-room-button" type="submit" disabled>添加直播间</button>
          </form>
          <p class="room-empty caption" id="rooms-empty">还没有直播间。</p>
          <div id="rooms" class="rooms"></div>
          <template id="room-template">
            <article class="room">
              <header class="room-top">
                <div class="room-label"><strong data-part="id"></strong><span class="state" data-part="phase"></span></div>
                <div class="room-actions">
                  <button class="action" data-room-action="toggle" type="button"></button>
                  <button class="action remove-room" data-room-action="remove" type="button">移除</button>
                </div>
              </header>
              <p class="caption canonical-room" data-part="canonical" hidden></p>
              <div class="stats" aria-label="运行统计">
                <div class="stat"><strong data-part="received">0</strong><span>新弹幕</span></div>
                <div class="stat"><strong data-part="replies">0</strong><span>已回复</span></div>
                <div class="stat"><strong data-part="window">未唤醒</strong><span>接话窗口</span></div>
              </div>
              <ul class="issues" data-part="issues" hidden></ul>
              <details class="media-settings">
                <summary>音视频识别 <span class="caption" data-part="media-summary">未启用</span></summary>
                <form data-part="media-form">
                  <fieldset>
                    <div class="fields">
                      <label class="preference">语音识别<input class="switch" type="checkbox" name="audio"></label>
                      <label class="preference">视频识别<input class="switch" type="checkbox" name="video"></label>
                      <label class="field"><span>语音识别模型</span><select name="stt_provider"></select></label>
                      <label class="field"><span>视觉模型</span><select name="vision_provider"></select></label>
                      <label class="field"><span>语音片段上限（秒）</span><input name="audio_segment" type="number" min="3" max="15" required></label>
                      <label class="field"><span>抽帧间隔（秒）</span><input name="frame_interval" type="number" min="2" max="60" required></label>
                      <label class="field"><span>附和间隔（秒）</span><input name="echo_interval" type="number" min="10" max="3600" placeholder="继承共享设置"></label>
                      <label class="field"><span>附和概率</span><input name="echo_probability" type="number" min="0" max="1" step="any" placeholder="继承共享设置"></label>
                    </div>
                    <div class="form-foot"><span class="caption" data-part="media-status"></span><button class="action" type="submit">保存房间设置</button></div>
                    <ul class="issues" data-part="media-issues" hidden></ul>
                  </fieldset>
                </form>
              </details>
            </article>
          </template>
        </section>
        <section class="panel pad" id="dialogue" aria-labelledby="dialogue-title">
          <div class="panel-title"><h2 id="dialogue-title">对话设置</h2><span class="caption">所有直播间共用</span></div>
          <form id="settings">
            <fieldset id="configuration" disabled>
              <div class="fields">
                <label class="field"><span>AstrBot 聊天模型</span><select id="provider" data-field="MODEL_PROVIDER_ID"><option value="">选择聊天模型</option></select></label>
                <label class="field"><span>复用 AstrBot 人格</span><select id="persona" data-field="ASTRBOT_PERSONA_ID"><option value="">不复用人格</option></select></label>
              </div>
              <div class="field keywords"><label for="keyword">自定义唤醒词</label>
                <div class="chipbox" id="chips"><input id="keyword" maxlength="80" placeholder="输入词语并回车"><button class="action" id="add-word" type="button">添加</button></div>
              </div>
              <div class="form-foot"><span id="window-hint" class="caption">喊中任一唤醒词后可继续接话。</span><button class="action primary" type="submit">保存设置</button></div>
              <details>
                <summary>高级设置</summary>
                <div class="fields">
                  <label class="preference field-wide">关键词唤醒模式<input class="switch" data-field="KEYWORD_MODE" type="checkbox"></label>
                  <label class="field"><span>唤醒窗口（秒）</span><input data-field="WINDOW_SECONDS" type="number" min="0" max="3600" required></label>
                  <label class="field"><span>成功回复续时（秒）</span><input data-field="WINDOW_EXTEND_SECONDS" type="number" min="0" max="3600" required></label>
                  <label class="field"><span>单轮上限（秒）</span><input data-field="WINDOW_MAX_SECONDS" type="number" min="1" max="7200" required></label>
                  <label class="preference field-wide">窗口外低频附和<input class="switch" data-field="ECHO_ENABLED" type="checkbox"></label>
                  <label class="field"><span>附和间隔（秒）</span><input data-field="ECHO_INTERVAL_SECONDS" type="number" min="10" max="3600" required></label>
                  <label class="field"><span>附和概率</span><input data-field="ECHO_PROBABILITY" type="number" min="0" max="1" step="any" required></label>
                  <label class="field"><span>发送冷却（秒）</span><input data-field="REPLY_COOLDOWN_SECONDS" type="number" min="2" max="120" required></label>
                  <label class="field"><span>每分钟发送上限</span><input data-field="MAX_PER_MINUTE" type="number" min="1" max="30" required></label>
                  <label class="field"><span>单条回复字数</span><input data-field="MAX_REPLY_CHARS" type="number" min="2" max="40" required></label>
                  <label class="field"><span>轮询间隔（秒）</span><input data-field="POLL_SECONDS" type="number" min="2" max="30" required></label>
                  <label class="field"><span>模型超时（秒）</span><input data-field="MODEL_TIMEOUT_SECONDS" type="number" min="5" max="40" required></label>
                  <label class="field field-wide"><span>FFmpeg 程序路径</span><input data-field="FFMPEG_PATH" maxlength="4096" placeholder="留空自动查找，找不到时使用依赖自带程序"><small class="caption" id="ffmpeg-status">正在查找 FFmpeg…</small></label>
                  <label class="field field-wide"><span>忽略的 B 站 UID</span><input data-field="IGNORE_UIDS" placeholder="多个 UID 用逗号分隔"></label>
                  <label class="field field-wide"><span>直播人格补充提示词</span><textarea data-field="PERSONA_PROMPT" rows="3" maxlength="4000"></textarea></label>
                  <label class="field field-wide"><span>正式回复附加提示词</span><textarea data-field="REPLY_INSTRUCTION" rows="2" maxlength="2000"></textarea></label>
                  <label class="field field-wide"><span>附和专用提示词</span><textarea data-field="ECHO_INSTRUCTION" rows="2" maxlength="2000"></textarea></label>
                </div>
              </details>
            </fieldset>
          </form>
        </section>
      </div>
      <div class="stack">
        <section class="panel pad" id="account" aria-labelledby="account-title">
          <div class="panel-title"><h2 id="account-title">账号连接</h2><span class="state" id="account-state">读取中</span></div>
          <div class="tabs" role="tablist" aria-label="登录来源">
            <button id="tab-local" class="tab" type="button" role="tab" aria-controls="local" aria-selected="true">独立扫码</button>
            <button id="tab-bili" class="tab" type="button" role="tab" aria-controls="bili" aria-selected="false" tabindex="-1">复用 BiliBot</button>
          </div>
          <div id="local" class="account-body" role="tabpanel" aria-labelledby="tab-local">
            <div class="scan">
              <div class="qr-frame" id="qr" hidden><img id="qr-image" alt="B 站登录二维码"></div>
              <div aria-live="polite"><strong id="local-title">连接 B 站账号</strong><small id="local-caption">生成二维码后，用 B 站 App 扫码确认。</small></div>
            </div>
            <div class="scan-actions">
              <button class="action" id="use-local" type="button" hidden disabled>使用独立账号</button>
              <button class="action" id="new-qr" type="button" disabled>生成二维码</button>
            </div>
          </div>
          <div id="bili" class="account-body" role="tabpanel" aria-labelledby="tab-bili" hidden>
            <div class="linked">
              <span class="mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-3 3.5-5 7.5-5s7.5 2 7.5 5"/></svg></span>
              <div><strong id="bilibot-title">BiliBot 登录</strong><p id="bilibot-caption" class="caption">正在读取账号状态。</p></div>
            </div>
            <div class="scan-actions"><button class="action" id="use-bili" type="button" disabled>使用此账号</button></div>
          </div>
          <label class="memory-row">
            <span><strong>联动 BiliBot 直播记忆</strong><small id="memory-caption">可与登录来源分别设置。</small></span>
            <input class="switch" id="memory" type="checkbox" disabled>
          </label>
        </section>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
